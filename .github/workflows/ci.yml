# Every push and PR: the same checks as `npm run lint/typecheck/test*` locally (ARCHITECTURE.md §11).
name: CI

on:
  push:
    branches: [main]
    tags: ['V*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Lint, types, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # One job per database group (a compose profile, V6.1): each starts only its own
  # databases, so a heavy server does not slow down or starve the others.
  integration:
    name: Integration tests (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [core, mssql, clickhouse, oracle, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATANEST_IT: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:up -- ${{ matrix.group }}
      - run: node scripts/annotate-failures.mjs "Integration (${{ matrix.group }})" npm run test:integration
      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml --profile '*' logs --no-color
      - if: always()
        run: npm run db:down

  e2e:
    name: E2E in VS Code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
      # A failure repeats its summary as an annotation, readable without a token.
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: node scripts/annotate-failures.mjs "E2E (Linux)" xvfb-run -a npm run test:e2e
      - name: Run e2e
        if: runner.os != 'Linux'
        run: node scripts/annotate-failures.mjs "E2E (${{ runner.os }})" npm run test:e2e

  package:
    name: Package .vsix
    needs: [check, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: datanest-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30
