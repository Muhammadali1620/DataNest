# Local databases for development and integration tests (ARCHITECTURE.md D17):
# host ports 7000-7999 on 127.0.0.1 only, data in tmpfs, so every `npm run db:up` starts from the seed.
# Each service belongs to one profile, its test group (V6.1): `npm run db:up -- <group>`
# starts only that group, `npm run db:up` starts `core`, `npm run db:down` stops them all.
name: datanest

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 5s
  retries: 90
  start_period: 5s

services:
  mysql:
    image: mysql:8.4
    container_name: datanest-mysql
    profiles: [core]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # TLS with the test CA in docker/tls (V4.3); plain connections still work.
      - --ssl-ca=/etc/datanest-tls/ca.crt
      - --ssl-cert=/etc/datanest-tls/server.crt
      - --ssl-key=/etc/datanest-tls/server.key
    environment:
      MYSQL_ROOT_PASSWORD: datanest_root
      MYSQL_DATABASE: datanest_test
      MYSQL_USER: datanest
      MYSQL_PASSWORD: datanest
    ports:
      - 127.0.0.1:7306:3306
    networks:
      default:
        # A name the server certificate does not cover, for verify-full tests.
        aliases: [mysql-alias]
    volumes:
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      <<: *healthcheck
      # Healthy only after the seed has finished (init runs without TCP).
      test:
        [
          'CMD',
          'mysql',
          '-h127.0.0.1',
          '-udatanest',
          '-pdatanest',
          '-e',
          'SELECT 1 FROM datanest_test.big_table LIMIT 1',
        ]

  mariadb:
    image: mariadb:11.4
    container_name: datanest-mariadb
    profiles: [core]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --ssl-ca=/etc/datanest-tls/ca.crt
      - --ssl-cert=/etc/datanest-tls/server.crt
      - --ssl-key=/etc/datanest-tls/server.key
    environment:
      MARIADB_ROOT_PASSWORD: datanest_root
      MARIADB_DATABASE: datanest_test
      MARIADB_USER: datanest
      MARIADB_PASSWORD: datanest
    ports:
      - 127.0.0.1:7307:3306
    volumes:
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'mariadb',
          '-h127.0.0.1',
          '-udatanest',
          '-pdatanest',
          '-e',
          'SELECT 1 FROM datanest_test.big_table LIMIT 1',
        ]

  postgres:
    image: postgres:17-alpine
    container_name: datanest-postgres
    profiles: [core]
    # PostgreSQL wants its TLS key owned by itself and private, which a bind mount
    # from the host cannot be; copy it into place first, then start as usual.
    entrypoint:
      - sh
      - -c
      - >-
        install -d -o postgres -m 700 /var/lib/postgresql/tls &&
        install -o postgres -m 600 /etc/datanest-tls/server.key /var/lib/postgresql/tls/ &&
        install -o postgres -m 644 /etc/datanest-tls/server.crt /etc/datanest-tls/ca.crt
        /var/lib/postgresql/tls/ &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/tls/server.key
        -c ssl_ca_file=/var/lib/postgresql/tls/ca.crt
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest
      POSTGRES_DB: datanest_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:7432:5432
    networks:
      default:
        aliases: [postgres-alias]
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'psql',
          '-h',
          '127.0.0.1',
          '-U',
          'datanest',
          '-d',
          'datanest_test',
          '-c',
          'SELECT 1 FROM big_table LIMIT 1',
        ]

  # SSH tunnels (V4): a server reachable from the host, with the databases behind it.
  ssh:
    build: ./ssh
    image: datanest-ssh:1
    container_name: datanest-ssh
    profiles: [core]
    ports:
      - 127.0.0.1:7022:22
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'nc', '-z', '127.0.0.1', '22']

  # A second SSH server with no port on the host: reached only through `ssh` (jump host).
  ssh-inner:
    build: ./ssh
    image: datanest-ssh:1
    container_name: datanest-ssh-inner
    profiles: [core]
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'nc', '-z', '127.0.0.1', '22']

  # SQL Server (V6.2). Its data cannot live in tmpfs (the server needs O_DIRECT), so it
  # stays in the container, which `npm run db:down` removes; every start is still clean.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    container_name: datanest-mssql
    profiles: [mssql]
    # The entrypoint copies the TLS key into place, which the image's own user cannot.
    user: root
    entrypoint: ['/bin/bash', '/datanest/entrypoint.sh']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Datanest_Root1
      MSSQL_MEMORY_LIMIT_MB: '2048'
      TZ: UTC
    ports:
      - 127.0.0.1:7143:1433
    volumes:
      - ./mssql:/datanest:ro
      - ./seed/mssql:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          '/opt/mssql-tools18/bin/sqlcmd',
          '-C',
          '-S',
          '127.0.0.1',
          '-U',
          'datanest',
          '-P',
          'datanest',
          '-b',
          '-Q',
          "IF NOT EXISTS (SELECT 1 FROM datanest_test.inventory.stock_levels) THROW 50000, 'seed not loaded', 1",
        ]

  # ClickHouse (V6.3): HTTP on 7123 for the tests, HTTPS with the test CA on 7443.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33-alpine
    container_name: datanest-clickhouse
    profiles: [clickhouse]
    environment:
      CLICKHOUSE_USER: datanest
      CLICKHOUSE_PASSWORD: datanest
      CLICKHOUSE_DB: datanest_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      TZ: UTC
    ports:
      - 127.0.0.1:7123:8123
      - 127.0.0.1:7443:8443
    volumes:
      - ./seed/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - ./tls:/etc/datanest-tls:ro
    tmpfs:
      - /var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'clickhouse-client --user datanest --password datanest -q "SELECT count() FROM datanest_test.big_table" | grep -qx 10000',
        ]

  # Oracle Database 23ai Free (V6.4). Its data stays in the container (the image ships a
  # ready database), which `npm run db:down` removes; every start is still clean.
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: datanest-oracle
    profiles: [oracle]
    environment:
      ORACLE_PASSWORD: datanest_root
      APP_USER: datanest
      APP_USER_PASSWORD: datanest
      TZ: UTC
    ports:
      - 127.0.0.1:7521:1521
    volumes:
      - ./seed/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'echo "SELECT COUNT(*) FROM datanest.big_table, datanest.seed_done;" | sqlplus -s datanest/datanest@//localhost/FREEPDB1 | grep -q 10000',
        ]

  # Servers that speak MySQL's or PostgreSQL's protocol (V6.5), group `compat`.
  # TiDB alone, on its built-in store; it loads the seed itself on its first start.
  tidb:
    image: pingcap/tidb:v8.5.1
    container_name: datanest-tidb
    profiles: [compat]
    command:
      - --store=unistore
      - --path=/tidb-data
      - --initialize-sql-file=/docker-entrypoint-initdb.d/01-schema.sql
    environment:
      TZ: UTC
    ports:
      - 127.0.0.1:7400:4000
    volumes:
      - ./seed/tidb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tidb-data
    healthcheck:
      <<: *healthcheck
      # No client in the image: TiDB's status port says whether big_table exists yet.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/10080 && printf 'GET /schema/datanest_test/big_table HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"name\"' <&3",
        ]

  # CockroachDB on one node, without TLS (its secure mode needs certificates per node).
  cockroach:
    image: cockroachdb/cockroach:v24.3.6
    container_name: datanest-cockroach
    profiles: [compat]
    command: start-single-node --insecure --store=type=mem,size=1GiB
    environment:
      TZ: UTC
    ports:
      - 127.0.0.1:7257:26257
    volumes:
      - ./seed/cockroach:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /cockroach/cockroach-data
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          './cockroach sql --insecure -e "SELECT count(*) FROM datanest_test.big_table" | grep -qx 10000',
        ]

  # YugabyteDB's PostgreSQL API (YSQL) on one node.
  yugabyte:
    image: yugabytedb/yugabyte:2024.2.2.1-b6
    container_name: datanest-yugabyte
    profiles: [compat]
    entrypoint: ['/bin/bash', '/datanest/entrypoint.sh']
    environment:
      TZ: UTC
    ports:
      - 127.0.0.1:7533:5433
    volumes:
      - ./yugabyte:/datanest:ro
      - ./seed/yugabyte:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /home/yugabyte/var
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          '/home/yugabyte/bin/ysqlsh -h "$(hostname)" -U yugabyte -d datanest_test -tAc "SELECT count(*) FROM big_table" | grep -qx 10000',
        ]

  # PostgreSQL with PostGIS (V13.13), group `postgis`: spatial values as WKT in the grid, in
  # dumps and in transfers. A group of its own, so the other PostgreSQL jobs stay light.
  postgis:
    image: postgis/postgis:17-3.5-alpine
    container_name: datanest-postgis
    profiles: [postgis]
    environment:
      POSTGRES_USER: datanest
      POSTGRES_PASSWORD: datanest
      POSTGRES_DB: datanest_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:7434:5432
    volumes:
      - ./seed/postgis:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD',
          'psql',
          '-h',
          '127.0.0.1',
          '-U',
          'datanest',
          '-d',
          'datanest_test',
          '-c',
          'SELECT 1 FROM spatial_places LIMIT 1',
        ]

  # Redis (V7.1), group `redis`: a server with ACL users and TLS on 7380, a master watched by
  # a Sentinel, and a cluster of three masters. Sentinel and cluster nodes listen on the
  # same port inside and outside, so the addresses they hand out work from the host.
  redis:
    image: redis:7.4.6-alpine
    container_name: datanest-redis
    profiles: [redis]
    entrypoint: ['/bin/sh', '/datanest/standalone.sh']
    ports:
      - 127.0.0.1:7379:6379
      - 127.0.0.1:7380:6380
    volumes:
      - ./redis:/datanest:ro
      - ./seed/redis:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'redis-cli --user datanest --pass datanest --no-auth-warning GET seed:done | grep -qx 1',
        ]

  redis-sentinel:
    image: redis:7.4.6-alpine
    container_name: datanest-redis-sentinel
    profiles: [redis]
    entrypoint: ['/bin/sh', '/datanest/sentinel.sh']
    ports:
      - 127.0.0.1:7381:7381
      - 127.0.0.1:7382:7382
    volumes:
      - ./redis:/datanest:ro
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'redis-cli -p 7382 -a sentinel --no-auth-warning SENTINEL get-master-addr-by-name datanest | grep -qx 7381',
        ]

  redis-cluster:
    image: redis:7.4.6-alpine
    container_name: datanest-redis-cluster
    profiles: [redis]
    entrypoint: ['/bin/sh', '/datanest/cluster.sh']
    ports:
      - 127.0.0.1:7391:7391
      - 127.0.0.1:7392:7392
      - 127.0.0.1:7393:7393
    volumes:
      - ./redis:/datanest:ro
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'redis-cli -c -p 7391 -a datanest --no-auth-warning GET cluster:seed | grep -qx done',
        ]

  # Redis Stack server (V13.14), group `redisjson`: Redis with the RedisJSON module, for
  # the viewer of JSON keys. Plain, no password; its own group keeps the heavy image out
  # of the `redis` job.
  redisjson:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: datanest-redisjson
    profiles: [redisjson]
    ports:
      - 127.0.0.1:7383:6379
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'redis-cli PING | grep -qx PONG']

  # libSQL server (V13.17), group `libsql`: sqld with its HTTP (Hrana) interface, no sign-in.
  # The data lives in tmpfs, so every start is empty; the tests make their own tables.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    container_name: datanest-libsql
    profiles: [libsql]
    # The image's own wrapper listens on 8080 and keeps the data in /var/lib/sqld.
    ports:
      - 127.0.0.1:7080:8080
    tmpfs:
      - /var/lib/sqld
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health HTTP/1.0\r\n\r\n" >&3; head -n1 <&3 | grep -q " 200"'

  # etcd (V13.19), group `etcd`: one member, plain HTTP on the client port, no sign-in; the
  # tests switch authentication on for a moment and off again. The image has no shell, so
  # the health check is etcdctl itself. The data lives in tmpfs, so every start is empty.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: datanest-etcd
    profiles: [etcd]
    command:
      - /usr/local/bin/etcd
      - --name=datanest
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:7239
    ports:
      - 127.0.0.1:7239:2379
    tmpfs:
      - /etcd-data
    healthcheck:
      <<: *healthcheck
      test: ['CMD', '/usr/local/bin/etcdctl', 'endpoint', 'health']

  # InfluxDB 2.x (V13.20), group `influxdb`: one organization and one bucket with a known
  # admin token (test-only constants, see test/helpers/influxdb-servers.ts). The data lives
  # in tmpfs, so every start is empty; the tests write their own points.
  influxdb:
    image: influxdb:2.7
    container_name: datanest-influxdb
    profiles: [influxdb]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: datanest
      DOCKER_INFLUXDB_INIT_PASSWORD: datanest-test-password
      DOCKER_INFLUXDB_INIT_ORG: datanest
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: datanest-test-token
    ports:
      - 127.0.0.1:7186:8086
    tmpfs:
      - /var/lib/influxdb2
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8086/health']

  # Neo4j (V13.21), group `neo4j`: the community server, its HTTP port (Query API) on 7474; Bolt
  # is not published, DataNest does not speak it. One sign-in, `neo4j` / `datanest-test`. The
  # memory is held small so the JVM stays friendly to a laptop; the data lives in tmpfs.
  neo4j:
    image: neo4j:5-community
    container_name: datanest-neo4j
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: neo4j/datanest-test
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - 127.0.0.1:7474:7474
    tmpfs:
      - /data
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:7474/']

  # Apache Cassandra (V13.22), group `cassandra`: one node, the CQL port on 7942, no sign-in. The
  # heap is held small and the data lives in tmpfs. It takes a minute or two to be ready; the
  # test makes its own keyspace. The node advertises its container address, which the driver
  # never uses: every request goes to the one address the connection names.
  cassandra:
    image: cassandra:4.1
    container_name: datanest-cassandra
    profiles: [cassandra]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: datanest
    ports:
      - 127.0.0.1:7942:9042
    tmpfs:
      - /var/lib/cassandra
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'cqlsh -e "SELECT release_version FROM system.local" > /dev/null 2>&1']
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 40s

  # MongoDB (V7.5), group `mongodb`: a single-member replica set on 7017 with users and
  # TLS next to plain connections. It listens on the same port inside and outside, so the
  # member address the set hands out works from the host.
  mongodb:
    image: mongo:8.2.12
    container_name: datanest-mongodb
    profiles: [mongodb]
    entrypoint: ['/bin/sh', '/datanest/start.sh']
    ports:
      - 127.0.0.1:7017:7017
    volumes:
      - ./mongodb:/datanest:ro
      - ./seed/mongodb:/docker-entrypoint-initdb.d:ro
      - ./tls:/etc/datanest-tls:ro
    tmpfs:
      - /data/db
    healthcheck:
      <<: *healthcheck
      test:
        [
          'CMD-SHELL',
          'mongosh --port 7017 --quiet -u datanest -p datanest --authenticationDatabase admin --eval ''quit(db.getSiblingDB("datanest").seed.countDocuments() === 1 ? 0 : 1)''',
        ]

  # Elasticsearch (V7.8), group `elasticsearch`: one node with security on over plain HTTP,
  # the `elastic` user (password `datanest`) and a read-only `reader`.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    container_name: datanest-elasticsearch
    profiles: [elasticsearch]
    entrypoint: ['/bin/bash', '/datanest/start.sh']
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: datanest
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      xpack.license.self_generated.type: basic
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - 127.0.0.1:7200:9200
    volumes:
      - ./elasticsearch:/datanest:ro
      - ./seed/elasticsearch:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    healthcheck:
      <<: *healthcheck
      test:
        ['CMD-SHELL', 'curl -sf -u elastic:datanest http://localhost:9200/datanest-seed >/dev/null']
