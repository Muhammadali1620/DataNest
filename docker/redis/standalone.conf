# Settings of the standalone test server; data lives only in memory.
port 6379
tls-port 6380
tls-cert-file /etc/datanest-tls/server.crt
tls-key-file /etc/datanest-tls/server.key
tls-ca-cert-file /etc/datanest-tls/ca.crt
tls-auth-clients optional
save ""
appendonly no
databases 16
requirepass datanest
user datanest on >datanest ~* &* +@all
user reader on >reader ~* &* -@all +@read +@connection +info +select +scan +type +ttl +pttl
